; MissionStats - Archivo de configuración (ESPAÑOL)
; Guarda SIEMPRE este archivo en codificación UTF-8 para que se vean bien los acentos y la eñe.
;
; CÓMO USARLO:
;   1) Renómbralo a "dinput8.ini" y déjalo en la MISMA carpeta que "dinput8.dll"
;      (normalmente: Dishonored\Binaries\Win32).
;   2) Edita los textos de [Strings] y activa/desactiva funciones en [Options] con true/false.
;   3) Cierra y vuelve a abrir el juego para aplicar los cambios.
;
; NOTA: los textos van entre comillas y precedidos de L  ->  L"texto"
;       En "msgCoinsCollected", conserva los comodines %g (monedas recogidas) y %d (total).

; Versión 1.1 - Español

[Strings]
btnStatsText = L"ESTADÍSTICAS"
msgAlarm = L"Alarma activada"
msgBodyFound = L"Cuerpo encontrado"
msgSpotted = L"Te han detectado"
msgKilled = L"Has matado a alguien"
msgCoinsCollected = L"Recogidas %g de %d monedas"

[Options]
bAddStatsButton = true
bShowAlarm = true
bShowBodyFound = true
bShowSpotted = true
bShowKilled = true
bShowCoinsCollected = true
